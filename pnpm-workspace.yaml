packages:
  - apps/*
  - packages/*
  - tooling/*
minimumReleaseAgeExclude:
  - prettier@3.10.1
allowBuilds:
  # @tailwindcss/cli (dev only). The watcher is not used by builds.
  "@parcel/watcher": false
  # drizzle-kit and tsx (dev only). esbuild works from its platform package without the install script.
  esbuild: false
  # firebase / firebase-admin: postinstall scripts only print notices.
  "@firebase/util": false
  protobufjs: false
overrides:
  # Nextra 4.6 schemas break on zod >= 4.4 (missing `children` key fails z.custom).
  nextra>zod: 4.3.6
  nextra-theme-docs>zod: 4.3.6
  # firebase-admin and better-auth ask for different versions. One version keeps a single
  # drizzle-orm instance, so its types match across packages.
  "@opentelemetry/api": 1.10.0
