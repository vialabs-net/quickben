name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: A minimal config and the call that fails. A repository link is best.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Quickben packages, Node.js and Next.js versions.
      placeholder: "@quickben/core 0.1.0, Node 24.1, Next 16.4"
    validations:
      required: true
