sonar.organization=vialabs-net
sonar.projectKey=vialabs-net_quickben
sonar.projectName=Quickben

sonar.sourceEncoding=UTF-8
sonar.sources=packages,apps
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,**/.next/**,**/generated/**,**/test/**,**/*.test.ts,**/*.test.tsx,**/*.test-d.ts,**/e2e/**,**/*.config.ts,**/*.config.js,**/*.config.mjs,packages/adapter-tests/**,apps/docs/content/**,apps/docs/samples/**,apps/docs/public/**,**/*.mdx

# The adapter contract suite is test code.
sonar.tests=packages,apps
sonar.test.inclusions=**/test/**/*.ts,**/test/**/*.tsx,**/*.test.ts,**/*.test.tsx,**/*.test-d.ts,**/e2e/**/*.ts,packages/adapter-tests/src/**/*.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/.next/**

# One report per package, with paths relative to the repo root.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/db-memory/coverage/lcov.info,packages/db-drizzle/coverage/lcov.info,packages/next/coverage/lcov.info,packages/admin/coverage/lcov.info,packages/plugin-tenancy/coverage/lcov.info

# The docs site has no unit tests. Its landing page is mostly repeated copy data.
# The playground is covered by Playwright smoke tests, not unit tests.
sonar.coverage.exclusions=apps/docs/**,apps/playground/**
sonar.cpd.exclusions=apps/docs/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
