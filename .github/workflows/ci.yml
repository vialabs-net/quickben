name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Format, lint and types do not depend on the Node.js version: run them once, next to the
  # test matrix, so the slowest job is shorter.
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-static-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-static-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm build

      # The SonarCloud job reuses these reports instead of running the tests a third time.
      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: SonarCloud
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for blame data and new-code detection.
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: packages

      # Pull requests from forks have no access to the token.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

  postgres:
    name: Postgres adapter tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUICKBEN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@quickben/db-drizzle

  # The playground commits its OpenAPI document. Fail when it is stale or breaks clients.
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The CLI imports quickben.config.ts, which needs the built packages.
      - run: pnpm turbo run build --filter=@quickben/playground^...
      - name: openapi.json is up to date
        run: pnpm --filter @quickben/playground openapi:check
      # A pull request with the "api-breaking" label may break the contract on purpose.
      - name: No breaking changes against trunk
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: |
          git fetch --depth=1 origin trunk
          if git show origin/trunk:apps/playground/openapi.json > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            pnpm --filter @quickben/playground exec quickben-openapi diff "$RUNNER_TEMP/base.json" openapi.json
          else
            echo "trunk has no apps/playground/openapi.json yet: nothing to compare."
          fi

  scaffold:
    name: create-quickben scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      # Scaffolds pglite + blank, installs @quickben/* from `pnpm pack` tarballs, runs next build and next start.
      - run: pnpm --filter create-quickben test:e2e

  e2e:
    name: Playground e2e (cacheComponents ${{ matrix.cache-components }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The playground turns on cacheComponents unless QUICKBEN_CACHE_COMPONENTS is "0".
        cache-components: ["on", "off"]
    env:
      QUICKBEN_CACHE_COMPONENTS: ${{ matrix.cache-components == 'off' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@quickben/playground...

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @quickben/playground exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @quickben/playground exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @quickben/playground exec playwright install-deps chromium
      - run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
      - name: e2e with multi-tenancy (QUICKBEN_TENANCY=1)
        run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
          QUICKBEN_TENANCY: "1"
          QUICKBEN_DB: memory
      - name: e2e with document reading (QUICKBEN_DOC_READER=1)
        run: pnpm --filter @quickben/playground test:e2e e2e/doc-reader.spec.ts
        env:
          CI: "true"
          QUICKBEN_DOC_READER: "1"
          QUICKBEN_DB: memory
      - name: e2e with connections (QUICKBEN_CONNECTIONS=1)
        run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
          QUICKBEN_CONNECTIONS: "1"
          QUICKBEN_DB: memory
      - name: e2e in Spanish (QUICKBEN_LOCALE=es)
        run: pnpm --filter @quickben/playground test:e2e e2e/i18n.spec.ts
        env:
          CI: "true"
          QUICKBEN_LOCALE: es
          QUICKBEN_DB: memory
      - name: e2e with Better Auth (QUICKBEN_AUTH=better-auth)
        run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
          QUICKBEN_AUTH: better-auth
          QUICKBEN_DB: memory

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.cache-components }}
          path: apps/playground/test-results
          retention-days: 7
