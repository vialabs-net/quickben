sonar.organization=vialabs-net
sonar.projectKey=vialabs-net_quickben
sonar.projectName=Quickben

sonar.sourceEncoding=UTF-8
sonar.sources=packages,apps
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,**/.next/**,**/generated/**,**/test/**,**/*.test.ts,**/*.test-d.ts,**/*.config.ts,**/*.config.js,**/*.config.mjs,packages/adapter-tests/**,apps/docs/content/**,apps/docs/samples/**,apps/docs/public/**,**/*.mdx

# The adapter contract suite is test code.
sonar.tests=packages
sonar.test.inclusions=**/test/**/*.ts,**/*.test.ts,**/*.test-d.ts,packages/adapter-tests/src/**/*.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**

# One report per package, with paths relative to the repo root.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/db-memory/coverage/lcov.info

# The docs site has no unit tests.
sonar.coverage.exclusions=apps/docs/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
