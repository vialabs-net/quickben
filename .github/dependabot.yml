version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and eslint-plugin-sonarjs support TypeScript < 6.1 (see the peer range
      # in tooling/eslint-config). Bump TypeScript by hand when they support a newer one.
      - dependency-name: typescript
        versions: [">= 6.1.0"]
      # Types must match the lowest supported Node.js (engines: >= 22).
      - dependency-name: "@types/node"
        versions: [">= 23.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
