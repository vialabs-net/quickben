name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Format, lint and types do not depend on the Node.js version: run them once, next to the
  # test matrix, so the slowest job is shorter.
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-static-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-static-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm build

  postgres:
    name: Postgres adapter tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUICKBEN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@quickben/db-drizzle

  scaffold:
    name: create-quickben scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      # Scaffolds pglite + blank, installs @quickben/* from `pnpm pack` tarballs, runs next build and next start.
      - run: pnpm --filter create-quickben test:e2e

  e2e:
    name: Playground e2e (cacheComponents ${{ matrix.cache-components }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The playground turns on cacheComponents unless QUICKBEN_CACHE_COMPONENTS is "0".
        cache-components: ["on", "off"]
    env:
      QUICKBEN_CACHE_COMPONENTS: ${{ matrix.cache-components == 'off' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@quickben/playground...

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @quickben/playground exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @quickben/playground exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @quickben/playground exec playwright install-deps chromium
      - run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
      - name: e2e with multi-tenancy (QUICKBEN_TENANCY=1)
        run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
          QUICKBEN_TENANCY: "1"
          QUICKBEN_DB: memory
      - name: e2e with document reading (QUICKBEN_DOC_READER=1)
        run: pnpm --filter @quickben/playground test:e2e e2e/doc-reader.spec.ts
        env:
          CI: "true"
          QUICKBEN_DOC_READER: "1"
          QUICKBEN_DB: memory
      - name: e2e with Better Auth (QUICKBEN_AUTH=better-auth)
        run: pnpm --filter @quickben/playground test:e2e
        env:
          CI: "true"
          QUICKBEN_AUTH: better-auth
          QUICKBEN_DB: memory

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.cache-components }}
          path: apps/playground/test-results
          retention-days: 7
